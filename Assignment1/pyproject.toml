[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech545-assignment1"
version = "1.0.0"
description = "Reusable quantitative-risk functions for FinTech 545 Assignment 1"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "statsmodels>=0.14",
]

[tool.setuptools.packages.find]
include = ["fintech545*"]
