[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech545-assignment3"
version = "1.0.0"
description = "Options, risk, and portfolio analysis numerical library"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "scipy>=1.14", "pandas>=2.2", "matplotlib>=3.8", "reportlab>=4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["assignment3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
