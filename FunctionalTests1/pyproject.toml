[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech545samuelma-risk"
version = "0.1.0"
description = "FINTECH 545 functional tests and reusable risk functions"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "pandas>=2.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["risk545*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
