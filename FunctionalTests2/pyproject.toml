[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech545-functionaltests2"
version = "1.0.0"
description = "Reusable risk, portfolio, attribution, option and copula calculations for FINTECH 545"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.14", "pandas>=2.2"]

[tool.setuptools.packages.find]
include = ["risk545_ft2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
